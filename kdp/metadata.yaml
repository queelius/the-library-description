# === Author Bio (Amazon Author Central) ==============================
author_bio: |
  Alex Towell is a mathematician and computer scientist completing a PhD
  at Southern Illinois University Edwardsville, where he also earned
  master's degrees in mathematics and computer science. His research is in
  artificial intelligence and machine learning, with Bayesian statistics
  underneath much of it, which is to say in prediction, and in the
  weighting of possibilities, which is to say in the subject of this book.

  In 2020 he was diagnosed with stage 3 cancer; in 2024 it progressed to
  stage 4. He has spent the years since in chemotherapy, surgeries, and the
  particular kind of uncertainty that comes from not knowing what the next
  scan will show.

  He did not write this book because he is dying. Everyone is dying. He
  wrote it because the people around him deserve to be seen, and the finite
  stretch where his life runs alongside theirs is the stretch he has. He
  lives in Illinois with the people he loves.

