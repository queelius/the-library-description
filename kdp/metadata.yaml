# === Amazon Listing: Blurb ===========================================
# Max 4,000 chars; aim for ~1,200-1,800 for readability.
description: |
  Generating everything is trivial. The totality of all computable
  structures, the Library of every possible book, is the output of a
  one-line program. What is hard, what is the whole of the problem, is
  finding yourself inside it. You are not a single observer with a single
  history. You are a pattern instantiated at many indices, in many systems,
  under many possible laws, and a measure weights all of it and singles out
  none of it. Not which index is you. Not which system is real.

  *The Library: The Indifference of Description* takes the algorithmic
  information theory of the 1960s, results about probability, description,
  and computation settled for sixty years, and follows them, through one
  inversion of intuition, to a cold conclusion and a chosen response. The
  bedrock is mathematics a careful reader can follow: Bayes' theorem,
  Kraft's inequality, and Solomonoff's universal prior. On top of it the
  book takes a single labeled postulate, and no more, and traces
  what the picture does to continuation, mortality, love, memory, and the
  self.

  This is the third of three books built the same way. *Worldlines* took
  relativity literally and arrived at a four-dimensional structure
  indifferent to the lives threaded through it. *Multitudes* took quantum
  mechanics literally and found the same indifference one level deeper, in
  the measure on the branches. This book goes one level further out, to the
  measure on everything that can be computed, and finds the indifference
  there too, at the bottom, with nothing under it.

  The structure is indifferent. We are not. The structure does not care
  which index is yours, and there is no one above it who does. The only
  warmth the Library contains is the warmth we show each other inside it,
  here, at the coordinates we actually occupy. The same chosen response as
  *Worldlines*, in a colder room.

  For readers of Max Tegmark's *Our Mathematical Universe*, David Deutsch's
  *The Fabric of Reality*, and Derek Parfit's *Reasons and Persons*, who
  want the implications followed all the way down. No speculative physics
  beyond one labeled postulate. No reassurance that isn't earned.

