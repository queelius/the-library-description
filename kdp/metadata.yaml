# === Author Bio (Amazon Author Central) ==============================
author_bio: |
  Alex Towell is a mathematician and computer scientist completing a PhD
  at Southern Illinois University Edwardsville, where he also earned
  master's degrees in mathematics and computer science. His research is in
  information retrieval and Bayesian statistics, which is to say in
  indexing, and in the weighting of possibilities, which is to say in the
  subject of this book.

  In 2020 he was diagnosed with stage 3 cancer; in 2024 it progressed to
  stage 4. He has spent the years since in chemotherapy, surgeries, and the
  particular kind of uncertainty that comes from not knowing which index you
  are about to find yourself at.

  He did not write this book because he is dying. Everyone is dying. He
  wrote it because the measure is real, and the people inside it deserve to
  be seen, and the finite stretch where his pattern runs alongside theirs is
  the stretch he has. He lives in Illinois with the people he loves.

