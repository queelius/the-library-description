# === Amazon Listing: Blurb ===========================================
# Max 4,000 chars; aim for ~1,200-1,800 for readability.
description: |
  Generating everything is trivial. Every possible book, every computable
  description, is the output of a short program. What is hard, what is the
  whole of the problem, is picking anything out. Many descriptions fit what
  you have seen; the mathematics weights the descriptions without saying
  which is real, or which one is you. There are no joints. There are only
  the cuts you make.

  *The Library: The Indifference of Description* takes the algorithmic
  information theory of the 1960s, results about probability, description,
  and computation settled for sixty years, and follows them, through one
  inversion of intuition, to a cold conclusion and a chosen response. The
  bedrock is mathematics a careful reader can follow: Bayes' theorem,
  Kraft's inequality, and Solomonoff's universal prior. On top of it the
  book takes a single labeled postulate, and no more, and traces
  what the picture does to continuation, mortality, love, memory, and the
  self.

  This is the third of three books built the same way. *Worldlines* read
  relativity as a block universe and arrived at a four-dimensional
  structure indifferent to the lives threaded through it. *Multitudes* read
  quantum mechanics the Everettian way and found the same indifference one
  level deeper, in the measure on the branches. This book goes one level
  further out, to the weighting of every description that can be computed,
  and finds no joint there to stand on.

  The structure is indifferent. We are not. The structure does not single
  out which carving is yours, and no view from above settles it. The only
  warmth in the picture is the warmth we show each other,
  here, at the coordinates we actually occupy. The same chosen response as
  *Worldlines*, in a colder room.

  For readers of Max Tegmark's *Our Mathematical Universe*, David Deutsch's
  *The Fabric of Reality*, and Derek Parfit's *Reasons and Persons*, who
  want the implications followed all the way down. No speculation beyond
  one labeled postulate. No reassurance that isn't earned.

